name: Terraform CI

on:
  push:
    paths:
      - "week2/infra/**"
      - ".forgejo/workflows/terraform-ci.yml"

  pull_request:
    paths:
      - "week2/infra/**"
      - ".forgejo/workflows/terraform-ci.yml"

  workflow_dispatch:

jobs:
  terraform-check:
    name: Format and validate
    runs-on: stackit-ubuntu-22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Check credential structure
        shell: bash
        env:
          STACKIT_SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("STACKIT_SERVICE_ACCOUNT_KEY")
          if not raw:
              raise RuntimeError("STACKIT_SERVICE_ACCOUNT_KEY secret is empty")

          key = json.loads(raw)
          credentials = key.get("credentials", {})

          required = ("kid", "iss", "sub", "aud")
          missing = [name for name in required if not credentials.get(name)]

          if missing:
              raise RuntimeError(
                  "Missing service account fields: " + ", ".join(missing)
              )

          print("STACKIT service account key JSON is present and structurally valid")
          PY
        
      - name: Terraform init
        working-directory: week2/infra
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: terraform init -backend=false -input=false

      - name: Terraform fmt
        working-directory: week2/infra
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: terraform fmt -check -recursive

      - name: Terraform validate 
        working-directory: week2/infra
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: terraform validate
