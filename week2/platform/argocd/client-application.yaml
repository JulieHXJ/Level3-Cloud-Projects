# let argocd take over client deployment, creating argocd application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: psql-client
  namespace: argocd
spec:
  project: default

  source:
    # git repo
    repoURL: ssh://git@ssh.level3.git.onstackit.cloud/LEVEL3/julie.git
    # branch
    targetRevision: main
    # file to read
    path: week2/platform/client
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres-demo

  # auto sync 
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false