apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud3-api
  namespace: postgres-demo
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: cloud3-api
                port:
                  number: 80