apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud3-api
  namespace: postgres-demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: postgres-demo-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - julie-paas.runs.onstackit.cloud
      secretName: julie-paas-tls

  rules:
    - host: julie-paas.runs.onstackit.cloud
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: cloud3-api
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud3-ui
                port:
                  number: 80